<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="theme-color" content="#2563eb">
    
    <title>إعداد النظام | Mentra Lite</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/img/smalicon.png">
    <link rel="apple-touch-icon" href="assets/img/smalicon.png">
    
    <!-- تحميل المكتبات الأساسية -->
    <script src="assets/Tailwind.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="assets/dexie.min.js"></script>
    <script src="assets/js/db-init.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- مكتبة التنبيهات -->

    <!-- كود التحقق الفوري (يمنع الدخول لو مسجل مسبقاً) -->
    <script>
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.replace('dashboard.html');
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body { 
            font-family: 'Tajawal', sans-serif; 
            overscroll-behavior-y: contain;
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,0.05) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0.05) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,0.05) 0, transparent 50%);
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 25px 50px -12px rgba(37, 99, 235, 0.15);
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        /* أنميشن التنقل بين الخطوات */
        .step-active { display: block; animation: fadeInRight 0.4s ease-out forwards; }
        .step-hidden { display: none; }
        
        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .input-group:focus-within i { color: #2563eb; transform: scale(1.1); transition: all 0.3s; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-[100dvh] py-12 px-4 relative">

    <!-- خلفية ديكور -->
    <div class="fixed top-[-10%] left-[-10%] w-96 h-96 bg-blue-400/20 rounded-full blur-3xl pointer-events-none -z-10"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-96 h-96 bg-emerald-400/10 rounded-full blur-3xl pointer-events-none -z-10"></div>

    <!-- زر العودة للرئيسية -->
    <a href="index.html" class="absolute top-6 left-6 text-slate-500 hover:text-blue-600 bg-white border border-slate-200 px-4 py-2.5 rounded-xl font-bold text-xs md:text-sm shadow-sm transition-all flex items-center gap-2 hover:scale-105 active:scale-95 z-10">
        <i class="fas fa-home"></i> الرئيسية
    </a>

    <div class="glass-card w-full max-w-md rounded-[2rem] md:rounded-[2.5rem] p-6 md:p-8 border border-slate-100 relative z-20 my-auto">
        
        <!-- الهيدر -->
        <div class="text-center mb-8 mt-2">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-xl shadow-blue-500/30 transform rotate-3 hover:rotate-0 transition-transform cursor-pointer">
                <i class="fas fa-chart-line text-white text-3xl"></i>
            </div>
            <h1 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight">إعداد مشروع جديد</h1>
            <p class="text-slate-500 text-[11px] md:text-xs mt-2 font-bold"><i class="fas fa-lock text-emerald-500 mr-1"></i> جميع البيانات محفوظة على جهازك فقط</p>
        </div>

        <!-- شريط التقدم (Progress Bar) -->
        <div class="relative flex justify-between items-center mb-8 px-4">
            <div class="absolute top-1/2 right-4 left-4 h-1 bg-slate-100 -translate-y-1/2 z-0 rounded-full"></div>
            <div id="progress-line" class="absolute top-1/2 right-4 h-1 bg-blue-600 -translate-y-1/2 z-0 rounded-full transition-all duration-500" style="width: 0%;"></div>
            
            <div class="relative z-10 flex flex-col items-center gap-2">
                <div id="indicator-1" class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-black shadow-md border-4 border-white transition-colors duration-300">1</div>
                <span class="text-[10px] font-black text-blue-600">النشاط</span>
            </div>
            <div class="relative z-10 flex flex-col items-center gap-2">
                <div id="indicator-2" class="w-10 h-10 rounded-full bg-slate-200 text-slate-400 flex items-center justify-center font-black shadow-sm border-4 border-white transition-colors duration-300">2</div>
                <span id="text-2" class="text-[10px] font-black text-slate-400 transition-colors duration-300">حساب الدخول</span>
            </div>
        </div>

        <!-- فورم الإعداد -->
        <form id="setup-form" class="relative">
            
            <!-- الخطوة الأولى: بيانات النشاط -->
            <div id="step-1" class="step-active space-y-4">
                <div class="space-y-1.5 input-group">
                    <label class="text-[11px] font-black text-slate-500 px-1">اسم المشروع / المحل <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <i class="fas fa-briefcase absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 transition-colors"></i>
                        <input id="full_name" type="text" required class="w-full bg-slate-50 border-2 border-slate-100 focus:border-blue-500 focus:bg-white rounded-2xl py-3.5 pr-11 pl-4 font-bold text-slate-700 text-sm outline-none transition-all text-right shadow-sm placeholder-slate-300" placeholder="مثال: أسواق السلام"/>
                    </div>
                </div>

                <div class="space-y-1.5 input-group">
                    <label class="text-[11px] font-black text-slate-500 px-1">رقم التواصل <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <i class="fas fa-phone absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 transition-colors"></i>
                        <input id="phone" type="tel" required class="w-full bg-slate-50 border-2 border-slate-100 focus:border-blue-500 focus:bg-white rounded-2xl py-3.5 pr-11 pl-4 font-bold text-slate-700 text-sm outline-none transition-all text-right shadow-sm placeholder-slate-300" placeholder="01xxxxxxxxx"/>
                    </div>
                </div>

                <button type="button" onclick="nextStep()" class="w-full mt-6 py-4 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl font-black text-base shadow-lg shadow-slate-900/20 transition-all flex items-center justify-center gap-3 active:scale-95">
                    التالي <i class="fas fa-arrow-left"></i>
                </button>
            </div>

            <!-- الخطوة الثانية: حساب المدير -->
            <div id="step-2" class="step-hidden space-y-4">
                <div class="space-y-1.5 input-group">
                    <label class="text-[11px] font-black text-slate-500 px-1">اسم المستخدم (للتسجيل) <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <i class="fas fa-user-shield absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 transition-colors"></i>
                        <input id="username" type="text" required class="w-full bg-slate-50 border-2 border-slate-100 focus:border-blue-500 focus:bg-white rounded-2xl py-3.5 pr-11 pl-4 font-bold text-slate-700 text-sm outline-none transition-all text-right shadow-sm placeholder-slate-300" placeholder="مثال: admin"/>
                    </div>
                </div>

                <div class="space-y-1.5 input-group">
                    <label class="text-[11px] font-black text-slate-500 px-1">كلمة المرور <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <i class="fas fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 transition-colors"></i>
                        <input id="password" type="password" required class="w-full bg-slate-50 border-2 border-slate-100 focus:border-blue-500 focus:bg-white rounded-2xl py-3.5 pr-11 pl-4 font-bold text-slate-700 text-sm outline-none transition-all text-left tracking-widest shadow-sm placeholder-slate-300" placeholder="••••••••" dir="ltr"/>
                    </div>
                </div>

                <div class="flex gap-3 mt-6 pt-2">
                    <button type="button" onclick="prevStep()" class="w-14 shrink-0 py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-2xl font-black text-lg transition-all flex items-center justify-center active:scale-95 border border-slate-200">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                    <button id="submit-btn" type="submit" class="flex-1 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white rounded-2xl font-black text-base shadow-lg shadow-blue-500/30 transition-all flex items-center justify-center gap-3 active:scale-95">
                        <span id="btn-text">بدء الاستخدام مجاناً</span>
                        <i id="btn-icon" class="fas fa-check"></i>
                    </button>
                </div>
            </div>

            <!-- الخطوة الثالثة: شاشة التحميل/النجاح -->
            <div id="step-loading" class="step-hidden text-center py-8">
                <div id="loading-spinner" class="w-16 h-16 border-4 border-slate-100 border-t-blue-600 rounded-full animate-spin mx-auto mb-4"></div>
                <div id="success-icon" class="hidden w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full items-center justify-center text-3xl mx-auto mb-4 animate-bounce">
                    <i class="fas fa-check"></i>
                </div>
                <h3 id="loading-text" class="text-lg font-black text-slate-800">جاري تهيئة قاعدة البيانات...</h3>
                <p id="loading-subtext" class="text-xs font-bold text-slate-500 mt-2">يرجى الانتظار لحظات</p>
            </div>

        </form>

        <div class="mt-8 text-center pt-5 border-t border-slate-100" id="footer-login-link">
            <a href="login.html" class="inline-flex items-center gap-2 text-slate-500 font-bold text-sm hover:text-blue-600 transition-colors">
                <div class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-xs"><i class="fas fa-sign-in-alt"></i></div>
                لديك حساب بالفعل؟ تسجيل الدخول
            </a>
        </div>
    </div>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js');
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) { window.location.reload(); refreshing = true; }
                });
            });
        }
    </script>

    <!-- المنطق البرمجي (Steps & Database Setup) -->
    <script>
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const stepLoading = document.getElementById('step-loading');
        
        const progLine = document.getElementById('progress-line');
        const ind2 = document.getElementById('indicator-2');
        const text2 = document.getElementById('text-2');
        const footerLink = document.getElementById('footer-login-link');
        
        // الانتقال للخطوة الثانية
        function nextStep() {
            const nameInput = document.getElementById('full_name');
            const phoneInput = document.getElementById('phone');
            
            // التحقق من صحة الحقول (HTML5 Validation)
            if (!nameInput.checkValidity()) { nameInput.reportValidity(); return; }
            if (!phoneInput.checkValidity()) { phoneInput.reportValidity(); return; }

            // التبديل البصري
            step1.classList.remove('step-active');
            step1.classList.add('step-hidden');
            step2.classList.remove('step-hidden');
            step2.classList.add('step-active');

            // تحديث شريط التقدم
            progLine.style.width = '100%';
            ind2.classList.remove('bg-slate-200', 'text-slate-400');
            ind2.classList.add('bg-blue-600', 'text-white');
            text2.classList.add('text-blue-600');
        }

        // العودة للخطوة الأولى
        function prevStep() {
            step2.classList.remove('step-active');
            step2.classList.add('step-hidden');
            step1.classList.remove('step-hidden');
            step1.classList.add('step-active');

            // إرجاع شريط التقدم
            progLine.style.width = '0%';
            ind2.classList.remove('bg-blue-600', 'text-white');
            ind2.classList.add('bg-slate-200', 'text-slate-400');
            text2.classList.remove('text-blue-600');
        }

        // التعامل مع حفظ البيانات (Submit)
        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // إخفاء الخطوة 2 وإظهار شاشة التحميل
            step2.classList.remove('step-active');
            step2.classList.add('step-hidden');
            footerLink.classList.add('hidden');
            stepLoading.classList.remove('step-hidden');
            stepLoading.classList.add('step-active');

            const fullName = document.getElementById('full_name').value.trim();
            const username = document.getElementById('username').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;

            try {
                // ============================================================
                // MULTI-TENANCY: إعداد قاعدة البيانات الخاصة بالمحل
                // ============================================================
                const newDBName = tenantManager.buildDBName(fullName);

                // فحص التكرار
                const existingShops = tenantManager.getShopsList();
                if (existingShops.find(s => s.dbName === newDBName)) {
                    showSetupError(`المحل "${fullName}" مسجل مسبقاً! جرب اسماً مختلفاً.`);
                    return;
                }

                tenantManager.switchTo(newDBName);

                const newDB = new Dexie(newDBName);
                newDB.version(4).stores({
                    settings:        'id, project_name, shop_name, phone, logo',
                    local_users:     '++id, username, full_name, role',
                    active_session:  'id, user_id, login_time',
                    products:        '++id, name_ar, sku, category, stock_qty, price, cost',
                    invoices:        '++id, invoice_number, type, customer_vendor_id, date, total, status',
                    invoice_items:   '++id, invoice_id, product_id, price, qty, total_item',
                    accounts:        '++id, code, name_ar, type, balance',
                    journal:         '++id, date, ref_no, description, total',
                    journal_items:   '++id, journal_id, account_id, debit, credit',
                    stock_movements: '++id, product_id, type, qty, date, ref_id'
                });
                await newDB.open();

                const userId = await newDB.local_users.add({
                    full_name: fullName, username: username, password: password,
                    phone: phone, role: 'admin', created_at: new Date().toISOString()
                });

                await newDB.table('settings').put({
                    id: 1, project_name: 'MentraERPLite', shop_name: fullName, phone: phone, currency: 'EGP', tax_rate: 0
                });

                await newDB.active_session.clear();
                await newDB.active_session.add({ id: 1, user_id: userId, login_time: new Date().toISOString() });

                tenantManager.addShopToList(fullName, newDBName, username);

                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userName', fullName);
                localStorage.setItem('userRole', 'admin');

                // عرض رسالة النجاح
                showSetupSuccess();

            } catch (err) {
                console.error(err);
                showSetupError('فشل حفظ البيانات في المتصفح! تأكد من وجود مساحة كافية.');
            }
        });

        // دوال التحكم في واجهة التحميل/الخطأ
        function showSetupSuccess() {
            document.getElementById('loading-spinner').classList.add('hidden');
            const successIcon = document.getElementById('success-icon');
            successIcon.classList.remove('hidden');
            successIcon.classList.add('flex');
            
            document.getElementById('loading-text').innerText = 'تم الإعداد بنجاح!';
            document.getElementById('loading-text').classList.add('text-emerald-600');
            document.getElementById('loading-subtext').innerText = 'جاري توجيهك للوحة التحكم...';
            
            setTimeout(() => { window.location.replace('dashboard.html'); }, 1200);
        }

        function showSetupError(msg) {
            Swal.fire({
                icon: 'error', title: 'خطأ في الإعداد', text: msg,
                customClass: { popup: 'rounded-3xl', confirmButton: 'rounded-xl font-bold px-6 py-2' }
            });
            // العودة للخطوة الأولى للتعديل
            stepLoading.classList.remove('step-active');
            stepLoading.classList.add('step-hidden');
            footerLink.classList.remove('hidden');
            prevStep();
        }
    </script>
</body>
</html>
